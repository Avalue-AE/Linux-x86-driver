
# ================================
# ERX-ZXEP Board Configuration File
# ================================
CONFIG_BOARD_NAME="ERX-ZXEP"

# ------------------------------------------------------------------
# STATUS: NOT HARDWARE-VALIDATED
# Auto-ported from the legacy driver (Avalue_driver_deprecate/config).
# Passes config.sh/build checks only; NOT yet verified on real hardware.
# Confirm every "# TODO verify" value (CHIPID, voltage LSB, threm_* and
# other channels) on the bench before relying on this board.
# ------------------------------------------------------------------

# Ported from erx_zxep_init() in Avalue_driver_deprecate/config/config.c (~line 3090).
# Legacy chip: fun_ctl_type_it85x8 (ITE EC) for wdt/pwm/lvds/vin/temp/fan/fan_mode.

# ==================================
# ===== Watchdog Configuration =====
# ==================================
MAKE_WDT_DEVICE=ec
MAKE_WDT_CHIPSET=ite
CONFIG_WDT_CHIPSET=ite
# TODO verify: legacy stores chip type (it85x8), not a numeric CHIPID.
CONFIG_CHIPID=0x5782


# ==========================================
# ===== Hardware Monitor Configuration =====
# ==========================================
MAKE_HWM_DEVICE=ec
MAKE_HWM_CHIPSET=ite
CONFIG_HWM_CHIPSET=ite

# ===== Hardware Monitor Voltage Configuration =====
#define ITE_REG_HWM_VOLTAGE(n) (0x30 + (n))
# Legacy vin[]    = { sensor_adc, threm_lan, voltage_vin_l, threm_cpu, blk_vr_mod }
# Legacy vin_vr[] = { vr_200_20,  vr_def,    vr_100_11,     vr_def,    vr_def }
# threm_lan / threm_cpu are genuine EC voltage channels (Rule 2 of the porting
# guide) - the EC exposes them through the voltage register block, so they are
# ENABLEd like any other vin[] entry, not treated as temperature sensors.
# ITE volt step = legacy 117/10 mV/count for every channel; TODO verify on hardware.

CONFIG_HWM_VOLTAGE_0_ENABLE=1
CONFIG_HWM_VOLTAGE_0_REG=ITE_REG_HWM_VOLTAGE(0)
CONFIG_HWM_VOLTAGE_0_LABEL="Sensor_ADC"
CONFIG_HWM_VOLTAGE_0_LSB=12
CONFIG_HWM_VOLTAGE_0_R1=200000
CONFIG_HWM_VOLTAGE_0_R2=20000

CONFIG_HWM_VOLTAGE_1_ENABLE=1
CONFIG_HWM_VOLTAGE_1_REG=ITE_REG_HWM_VOLTAGE(1)
CONFIG_HWM_VOLTAGE_1_LABEL="Threm_LAN"
CONFIG_HWM_VOLTAGE_1_LSB=12
# vr_def (1,1 kOhm) is the "measured directly" marker -> no divider.
CONFIG_HWM_VOLTAGE_1_R1=0
CONFIG_HWM_VOLTAGE_1_R2=0

CONFIG_HWM_VOLTAGE_2_ENABLE=1
CONFIG_HWM_VOLTAGE_2_REG=ITE_REG_HWM_VOLTAGE(2)
CONFIG_HWM_VOLTAGE_2_LABEL="Vin_L"
CONFIG_HWM_VOLTAGE_2_LSB=12
CONFIG_HWM_VOLTAGE_2_R1=100000
CONFIG_HWM_VOLTAGE_2_R2=11000

CONFIG_HWM_VOLTAGE_3_ENABLE=1
CONFIG_HWM_VOLTAGE_3_REG=ITE_REG_HWM_VOLTAGE(3)
CONFIG_HWM_VOLTAGE_3_LABEL="Threm_Cpu"
CONFIG_HWM_VOLTAGE_3_LSB=12
# vr_def (1,1 kOhm) is the "measured directly" marker -> no divider.
CONFIG_HWM_VOLTAGE_3_R1=0
CONFIG_HWM_VOLTAGE_3_R2=0

CONFIG_HWM_VOLTAGE_4_ENABLE=1
CONFIG_HWM_VOLTAGE_4_REG=ITE_REG_HWM_VOLTAGE(4)
CONFIG_HWM_VOLTAGE_4_LABEL="BLK_VR_MOD"
CONFIG_HWM_VOLTAGE_4_LSB=12
# vr_def (1,1 kOhm) is the "measured directly" marker -> no divider.
CONFIG_HWM_VOLTAGE_4_R1=0
CONFIG_HWM_VOLTAGE_4_R2=0

# Fixed to 5 voltage sensors for ITE
CONFIG_HWM_VOLTAGE_NUM=5
CONFIG_HWM_VOLTAGE_MAP={ CONFIG_HWM_VOLTAGE_0_ENABLE, CONFIG_HWM_VOLTAGE_1_ENABLE, CONFIG_HWM_VOLTAGE_2_ENABLE, CONFIG_HWM_VOLTAGE_3_ENABLE, CONFIG_HWM_VOLTAGE_4_ENABLE }


# ===== Hardware Monitor Temperature Configuration =====
#define ITE_REG_HWM_TEMPERATURE(n) (0x3B + (n))
# Legacy temp[] = { temp_cpu, temp_sys }

CONFIG_HWM_TEMPERATURE_0_ENABLE=1
CONFIG_HWM_TEMPERATURE_0_REG=ITE_REG_HWM_TEMPERATURE(0)
CONFIG_HWM_TEMPERATURE_0_LABEL="CPU"

CONFIG_HWM_TEMPERATURE_1_ENABLE=1
CONFIG_HWM_TEMPERATURE_1_REG=ITE_REG_HWM_TEMPERATURE(1)
CONFIG_HWM_TEMPERATURE_1_LABEL="System"

CONFIG_HWM_TEMPERATURE_2_ENABLE=0

# Fixed to 3 temperature sensors for ITE
CONFIG_HWM_TEMPERATURE_NUM=3
CONFIG_HWM_TEMPERATURE_MAP={ CONFIG_HWM_TEMPERATURE_0_ENABLE, CONFIG_HWM_TEMPERATURE_1_ENABLE, CONFIG_HWM_TEMPERATURE_2_ENABLE }

# ===== Hardware Monitor Fan Configuration =====
#define ITE_REG_HWM_FAN_SPEED(n) (0x35 + (n) * 2)
# Legacy fan[] = { fan_cpu, nodev, fan_sys } (fan_sys at array index 2). The two
# populated fans map to the two logical FAN channels, each keeping its legacy
# array index in _REG_SPEED (Rule 1): FAN_0 -> index 0, FAN_1 -> index 2.

CONFIG_HWM_FAN_0_ENABLE=1
CONFIG_HWM_FAN_0_REG_SPEED=ITE_REG_HWM_FAN_SPEED(0)
CONFIG_HWM_FAN_0_LABEL="CPU Fan"
CONFIG_HWM_FAN_0_SPEED_STEP=1

CONFIG_HWM_FAN_1_ENABLE=1
CONFIG_HWM_FAN_1_REG_SPEED=ITE_REG_HWM_FAN_SPEED(2)
CONFIG_HWM_FAN_1_LABEL="System Fan"
CONFIG_HWM_FAN_1_SPEED_STEP=1

# Fixed to 2 fan sensors for ITE
CONFIG_HWM_FAN_NUM=2
CONFIG_HWM_FAN_MAP={ CONFIG_HWM_FAN_0_ENABLE, CONFIG_HWM_FAN_1_ENABLE }

# ===== Hardware Monitor PWM Configuration =====
#define ITE_REG_HWM_PWM(n) (0x40 + (n))
# Legacy pwm[] = {} (ARRAY_SIZE 0) -- erx_zxep_init() defines no PWM channels.
# All physical PWM channels are disabled.

CONFIG_HWM_PWM_0_ENABLE=0
CONFIG_HWM_PWM_1_ENABLE=0
CONFIG_HWM_PWM_2_ENABLE=0
CONFIG_HWM_PWM_3_ENABLE=0
CONFIG_HWM_PWM_4_ENABLE=0
CONFIG_HWM_PWM_5_ENABLE=0

CONFIG_HWM_PWM_NUM=6
CONFIG_HWM_PWM_MAP={ CONFIG_HWM_PWM_0_ENABLE, CONFIG_HWM_PWM_1_ENABLE, CONFIG_HWM_PWM_2_ENABLE, CONFIG_HWM_PWM_3_ENABLE, CONFIG_HWM_PWM_4_ENABLE, CONFIG_HWM_PWM_5_ENABLE }


# ==============================
# ===== GPIO Configuration =====
# ==============================
# pca9555 SMBus GPIO expander via the Zhaoxin (兆芯) SMBus controller.
# Ported from legacy erx_zxep_init() dio_type_8_8: 8 input lines on port 0
# (offsets 0..7) + 8 output lines on port 1 (offsets 8..15).
# Zhaoxin SMBus base is read from PCI 00:11.0 config reg 0xD0 (BASE_PORT=0
# -> auto-detect). # TODO verify pin offsets / slave address on HW
MAKE_GPIO_DEVICE=smb
MAKE_GPIO_PROTOCOL=zhaoxin
MAKE_GPIO_CHIPSET=pca9555

CONFIG_SMBUS_BASE_PORT=0x0000
CONFIG_SMBUS_SLAVE_ADDR1=0x40
CONFIG_SMBUS_SLAVE_ADDR2=0x40

CONFIG_GPIO_PIN0_OFFSET=0
CONFIG_GPIO_PIN1_OFFSET=1
CONFIG_GPIO_PIN2_OFFSET=2
CONFIG_GPIO_PIN3_OFFSET=3
CONFIG_GPIO_PIN4_OFFSET=4
CONFIG_GPIO_PIN5_OFFSET=5
CONFIG_GPIO_PIN6_OFFSET=6
CONFIG_GPIO_PIN7_OFFSET=7
CONFIG_GPIO_PIN8_OFFSET=8
CONFIG_GPIO_PIN9_OFFSET=9
CONFIG_GPIO_PIN10_OFFSET=10
CONFIG_GPIO_PIN11_OFFSET=11
CONFIG_GPIO_PIN12_OFFSET=12
CONFIG_GPIO_PIN13_OFFSET=13
CONFIG_GPIO_PIN14_OFFSET=14
CONFIG_GPIO_PIN15_OFFSET=15
CONFIG_GPIO_PIN_NUM=16
CONFIG_GPIO_PIN_MAP={ CONFIG_GPIO_PIN0_OFFSET, CONFIG_GPIO_PIN1_OFFSET, CONFIG_GPIO_PIN2_OFFSET, CONFIG_GPIO_PIN3_OFFSET, CONFIG_GPIO_PIN4_OFFSET, CONFIG_GPIO_PIN5_OFFSET, CONFIG_GPIO_PIN6_OFFSET, CONFIG_GPIO_PIN7_OFFSET, CONFIG_GPIO_PIN8_OFFSET, CONFIG_GPIO_PIN9_OFFSET, CONFIG_GPIO_PIN10_OFFSET, CONFIG_GPIO_PIN11_OFFSET, CONFIG_GPIO_PIN12_OFFSET, CONFIG_GPIO_PIN13_OFFSET, CONFIG_GPIO_PIN14_OFFSET, CONFIG_GPIO_PIN15_OFFSET }



