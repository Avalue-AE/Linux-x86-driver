# ==================================================================
# Legacy source: bcx11_init() in Avalue_driver_deprecate/config.c
# (~line 4748). Unlike most boards, EVERY fun_ctl_init() call for this
# board is wired with fun_ctl_type_none and a 0-length array/NULL:
#
#   fun_ctl_init(&config->wdt,      fun_ctl_type_none, ..., 0, 0, NULL, vr_dummy);
#   fun_ctl_init(&config->pwm,      fun_ctl_type_none, ..., 0, 0, NULL, vr_dummy);
#   fun_ctl_init(&config->lvds,     fun_ctl_type_none, ..., 0, 0, NULL, vr_dummy);
#   fun_ctl_init(&config->vin,      fun_ctl_type_none, ..., 0, 0, NULL, vr_dummy);
#   fun_ctl_init(&config->temp,     fun_ctl_type_none, ..., 0, 0, NULL, vr_dummy);
#   fun_ctl_init(&config->fan,      fun_ctl_type_none, ..., 0, 0, NULL, vr_dummy);
#   fun_ctl_init(&config->fan_mode, fun_ctl_type_none, ..., 0, 0, NULL, vr_dummy);
#
# fun_ctl_type_none means "no chip backs this subsystem" -- there is no
# it85x8 (EC) or nct61x6d (SIO) wired for WDT or any HWM group (voltage,
# temperature, fan, PWM), and no LVDS / fan_mode either. There are no
# vin[]/temp[]/fan[]/pwm[] arrays to walk (array size is literally 0),
# so there is nothing to derive a LSB/R1/R2/register index from (Rules
# 1-3 need real array entries; none exist here). Per Rule 4 ("drop what
# has no HAL here"), WDT and HWM are omitted outright below rather than
# emitting an all-disabled block with invented NUM/MAP values.
# ==================================================================

# ==================================
# ===== Watchdog Configuration =====
# ==================================
# OMITTED: legacy wdt uses fun_ctl_type_none (no chip). No WDT HAL
# (ec/ite or sio/f81966) is wired for this board in the legacy driver.

# ==========================================
# ===== Hardware Monitor Configuration =====
# ==========================================
# OMITTED: legacy vin[]/temp[]/fan[]/pwm[] are all fun_ctl_type_none
# with ARRAY_SIZE 0 (no arrays declared at all). There is no EC/SIO
# chipset backing voltage, temperature, fan, or PWM channels on this
# board in the legacy driver, so no CONFIG_HWM_* keys are emitted.

# ==============================
# ===== GPIO Configuration =====
# ==============================
# pca9555 SMBus GPIO expander via the i801 host controller.
# Ported from legacy bcx11_init() dio_type_8_8: 8 input lines on
# port 0 (offsets 0..7) + 8 output lines on port 1
# (offsets 8..15). Single chip at slave_addr1; base
# port auto-detected. # TODO verify pin offsets / slave address on HW
MAKE_GPIO_DEVICE=smb
MAKE_GPIO_PROTOCOL=i801
MAKE_GPIO_CHIPSET=pca9555

CONFIG_SMBUS_BASE_PORT=0x0000
CONFIG_SMBUS_SLAVE_ADDR1=0x40
CONFIG_SMBUS_SLAVE_ADDR2=0x40

CONFIG_GPIO_PIN0_OFFSET=0
CONFIG_GPIO_PIN1_OFFSET=1
CONFIG_GPIO_PIN2_OFFSET=2
CONFIG_GPIO_PIN3_OFFSET=3
CONFIG_GPIO_PIN4_OFFSET=4
CONFIG_GPIO_PIN5_OFFSET=5
CONFIG_GPIO_PIN6_OFFSET=6
CONFIG_GPIO_PIN7_OFFSET=7
CONFIG_GPIO_PIN8_OFFSET=8
CONFIG_GPIO_PIN9_OFFSET=9
CONFIG_GPIO_PIN10_OFFSET=10
CONFIG_GPIO_PIN11_OFFSET=11
CONFIG_GPIO_PIN12_OFFSET=12
CONFIG_GPIO_PIN13_OFFSET=13
CONFIG_GPIO_PIN14_OFFSET=14
CONFIG_GPIO_PIN15_OFFSET=15
CONFIG_GPIO_PIN_NUM=16
CONFIG_GPIO_PIN_MAP={ CONFIG_GPIO_PIN0_OFFSET, CONFIG_GPIO_PIN1_OFFSET, CONFIG_GPIO_PIN2_OFFSET, CONFIG_GPIO_PIN3_OFFSET, CONFIG_GPIO_PIN4_OFFSET, CONFIG_GPIO_PIN5_OFFSET, CONFIG_GPIO_PIN6_OFFSET, CONFIG_GPIO_PIN7_OFFSET, CONFIG_GPIO_PIN8_OFFSET, CONFIG_GPIO_PIN9_OFFSET, CONFIG_GPIO_PIN10_OFFSET, CONFIG_GPIO_PIN11_OFFSET, CONFIG_GPIO_PIN12_OFFSET, CONFIG_GPIO_PIN13_OFFSET, CONFIG_GPIO_PIN14_OFFSET, CONFIG_GPIO_PIN15_OFFSET }


