# bcx11_init() wires every WDT/HWM subsystem to fun_ctl_type_none (see
# the extraction note above), so the legacy tree tells us NOTHING about
# which EC/super-I/O part — if any — backs this board's sensors. The ITE
# it85x8 skeleton below is only the house default (most Avalue boards
# use it); it is a GUESS, not extracted data. Confirm the real part from
# the schematic / EC firmware before enabling anything. If the board has
# no HWM/WDT chip at all, delete these blocks and leave BCX11 a stub.
#
# HOW TO TURN THIS INTO A REAL CONFIG
#   1. Identify the actual EC / super-I/O chip and the wired channels
#      (which rails, temps, fans, PWM; labels, register indices, divider
#      resistors R1/R2, LSB). If it is not ITE, do NOT reuse this
#      skeleton — copy the matching family's .conf instead
#      (sio/f81966 for a Fintek part; a new HAL is needed for nct61x6d).
#   2. Uncomment only the subsystem blocks that physically exist; delete
#      the rest. Replace every <...> placeholder with a real value.
#   3. Keep each _NUM at the chip's fixed channel count (ITE: 5 volt,
#      3 temp, 2 fan, 6 pwm) and keep every _MAP listing all channels.
