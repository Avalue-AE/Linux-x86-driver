#
# ACP-BYT2C is a Bay Trail (BYT) board. Every other BYT board in this
# tree drives its Watchdog / Hardware Monitor through the on-board ITE
# it85x8 EC (MAKE_*_DEVICE=ec, MAKE_*_CHIPSET=ite), so the ITE skeleton
# below is the most likely shape — but this is an ASSUMPTION, not
# extracted data. Confirm the actual super-I/O / EC part first.
#
# HOW TO TURN THIS INTO A REAL CONFIG
#   1. Confirm the EC/super-I/O chip and the wired channels from the
#      schematic or EC firmware (which rails, temps, fans, PWM exist;
#      their labels, register indices, divider resistors R1/R2, LSB).
#   2. Uncomment only the subsystem blocks that physically exist; delete
#      the rest. Replace every <...> placeholder with a real value.
#   3. Keep each _NUM at the chip's fixed channel count (ITE: 5 volt,
#      3 temp, 2 fan, 6 pwm) and keep every _MAP listing all channels.
#   4. Disabled channels only need the _ENABLE=0 line.
#   5. Verify referenced register macros exist in src/hal/ec/ite.h.
#   6. Delete this template header and run scripts/config.sh, then build.
#
# Closest working reference to copy from: configs/boards/ESM-TGH.conf
