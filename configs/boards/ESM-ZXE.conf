# ==================================
# ===== Watchdog Configuration =====
# ==================================
# legacy: fun_ctl_init(&config->wdt, fun_ctl_type_it85x8, fun_ctl_name_wdt, ...)
MAKE_WDT_DEVICE=ec
MAKE_WDT_CHIPSET=ite
CONFIG_WDT_CHIPSET=ite
# TODO verify CHIPID against real hardware
CONFIG_CHIPID=0x5782


# ==========================================
# ===== Hardware Monitor Configuration =====
# ==========================================
MAKE_HWM_DEVICE=ec
MAKE_HWM_CHIPSET=ite
CONFIG_HWM_CHIPSET=ite

# ===== Hardware Monitor Voltage Configuration =====
# legacy vin[]    = { sensor_adc, sensor_12s, sensor_vcore, threm_cpu, threm_sys }
# legacy vin_vr[] = { vr_def,     vr_200_10,  vr_def,       vr_10_10,  vr_10_10 }
# All 5 physical channels are populated (no nodev) - all enabled.

CONFIG_HWM_VOLTAGE_0_ENABLE=1
CONFIG_HWM_VOLTAGE_0_REG=ITE_REG_HWM_VOLTAGE(0)
CONFIG_HWM_VOLTAGE_0_LABEL="ADC"
# ITE volt step = legacy 117/10 mV; TODO verify on hardware
CONFIG_HWM_VOLTAGE_0_LSB=12
# vr_def (1,1) = measured directly -> no divider
CONFIG_HWM_VOLTAGE_0_R1=0
CONFIG_HWM_VOLTAGE_0_R2=0

CONFIG_HWM_VOLTAGE_1_ENABLE=1
CONFIG_HWM_VOLTAGE_1_REG=ITE_REG_HWM_VOLTAGE(1)
CONFIG_HWM_VOLTAGE_1_LABEL="12S"
# ITE volt step = legacy 117/10 mV; TODO verify on hardware
CONFIG_HWM_VOLTAGE_1_LSB=12
# vr_200_10 (200,10) kOhm -> Ohm
CONFIG_HWM_VOLTAGE_1_R1=200000
CONFIG_HWM_VOLTAGE_1_R2=10000

CONFIG_HWM_VOLTAGE_2_ENABLE=1
CONFIG_HWM_VOLTAGE_2_REG=ITE_REG_HWM_VOLTAGE(2)
CONFIG_HWM_VOLTAGE_2_LABEL="VCORE"
# ITE volt step = legacy 117/10 mV; TODO verify on hardware
CONFIG_HWM_VOLTAGE_2_LSB=12
# vr_def (1,1) = measured directly -> no divider
CONFIG_HWM_VOLTAGE_2_R1=0
CONFIG_HWM_VOLTAGE_2_R2=0

# threm_cpu is a real EC voltage channel (README Sec.2) - enabled, not disabled.
CONFIG_HWM_VOLTAGE_3_ENABLE=1
CONFIG_HWM_VOLTAGE_3_REG=ITE_REG_HWM_VOLTAGE(3)
CONFIG_HWM_VOLTAGE_3_LABEL="Threm_Cpu"
# ITE volt step = legacy 117/10 mV; TODO verify on hardware
CONFIG_HWM_VOLTAGE_3_LSB=12
# vr_10_10 (10,10) kOhm -> Ohm
CONFIG_HWM_VOLTAGE_3_R1=10000
CONFIG_HWM_VOLTAGE_3_R2=10000

# threm_sys is a real EC voltage channel (README Sec.2) - enabled, not disabled.
CONFIG_HWM_VOLTAGE_4_ENABLE=1
CONFIG_HWM_VOLTAGE_4_REG=ITE_REG_HWM_VOLTAGE(4)
CONFIG_HWM_VOLTAGE_4_LABEL="Threm_Sys"
# ITE volt step = legacy 117/10 mV; TODO verify on hardware
CONFIG_HWM_VOLTAGE_4_LSB=12
# vr_10_10 (10,10) kOhm -> Ohm
CONFIG_HWM_VOLTAGE_4_R1=10000
CONFIG_HWM_VOLTAGE_4_R2=10000

# Fixed to 5 voltage sensors for ITE
CONFIG_HWM_VOLTAGE_NUM=5
CONFIG_HWM_VOLTAGE_MAP={ CONFIG_HWM_VOLTAGE_0_ENABLE, CONFIG_HWM_VOLTAGE_1_ENABLE, CONFIG_HWM_VOLTAGE_2_ENABLE, CONFIG_HWM_VOLTAGE_3_ENABLE, CONFIG_HWM_VOLTAGE_4_ENABLE }


# ===== Hardware Monitor Temperature Configuration =====
# legacy temp[] = { temp_cpu, temp_sys }

CONFIG_HWM_TEMPERATURE_0_ENABLE=1
CONFIG_HWM_TEMPERATURE_0_REG=ITE_REG_HWM_TEMPERATURE(0)
CONFIG_HWM_TEMPERATURE_0_LABEL="CPU"

CONFIG_HWM_TEMPERATURE_1_ENABLE=1
CONFIG_HWM_TEMPERATURE_1_REG=ITE_REG_HWM_TEMPERATURE(1)
CONFIG_HWM_TEMPERATURE_1_LABEL="System"

CONFIG_HWM_TEMPERATURE_2_ENABLE=0

# Fixed to 3 temperature sensors for ITE
CONFIG_HWM_TEMPERATURE_NUM=3
CONFIG_HWM_TEMPERATURE_MAP={ CONFIG_HWM_TEMPERATURE_0_ENABLE, CONFIG_HWM_TEMPERATURE_1_ENABLE, CONFIG_HWM_TEMPERATURE_2_ENABLE }

# ===== Hardware Monitor Fan Configuration =====
# legacy fan[] = { fan_cpu }  -> physical channel 0

CONFIG_HWM_FAN_0_ENABLE=1
CONFIG_HWM_FAN_0_REG_SPEED=ITE_REG_HWM_FAN_SPEED(0)
CONFIG_HWM_FAN_0_LABEL="CPU Fan"
CONFIG_HWM_FAN_0_SPEED_STEP=1

CONFIG_HWM_FAN_1_ENABLE=0

# Fixed to 2 fan sensors for ITE
CONFIG_HWM_FAN_NUM=2
CONFIG_HWM_FAN_MAP={ CONFIG_HWM_FAN_0_ENABLE, CONFIG_HWM_FAN_1_ENABLE }

# ===== Hardware Monitor PWM Configuration =====
# legacy pwm[] = { fan_cpu, nodev, backlight }

CONFIG_HWM_PWM_0_ENABLE=1
CONFIG_HWM_PWM_0_REG=ITE_REG_HWM_PWM(0)
CONFIG_HWM_PWM_0_LABEL="CPU Fan PWM"

CONFIG_HWM_PWM_1_ENABLE=0

CONFIG_HWM_PWM_2_ENABLE=1
CONFIG_HWM_PWM_2_REG=ITE_REG_HWM_PWM(2)
CONFIG_HWM_PWM_2_LABEL="Backlight"

CONFIG_HWM_PWM_3_ENABLE=0
CONFIG_HWM_PWM_4_ENABLE=0
CONFIG_HWM_PWM_5_ENABLE=0

CONFIG_HWM_PWM_NUM=6
CONFIG_HWM_PWM_MAP={ CONFIG_HWM_PWM_0_ENABLE, CONFIG_HWM_PWM_1_ENABLE, CONFIG_HWM_PWM_2_ENABLE, CONFIG_HWM_PWM_3_ENABLE, CONFIG_HWM_PWM_4_ENABLE, CONFIG_HWM_PWM_5_ENABLE }


# ==============================
# ===== GPIO Configuration =====
# ==============================
# pca9555 SMBus GPIO expander via the Zhaoxin (兆芯) SMBus controller.
# Ported from legacy esm_zxe_init() dio_type_4_4: 4 input lines on port 0
# (offsets 0..3) + 4 output lines on port 1 (offsets 8..11).
# Zhaoxin SMBus base is read from PCI 00:11.0 config reg 0xD0 (BASE_PORT=0
# -> auto-detect). # TODO verify pin offsets / slave address on HW
MAKE_GPIO_DEVICE=smb
MAKE_GPIO_PROTOCOL=zhaoxin
MAKE_GPIO_CHIPSET=pca9555

CONFIG_SMBUS_BASE_PORT=0x0000
CONFIG_SMBUS_SLAVE_ADDR1=0x40
CONFIG_SMBUS_SLAVE_ADDR2=0x40

CONFIG_GPIO_PIN0_OFFSET=0
CONFIG_GPIO_PIN1_OFFSET=1
CONFIG_GPIO_PIN2_OFFSET=2
CONFIG_GPIO_PIN3_OFFSET=3
CONFIG_GPIO_PIN4_OFFSET=8
CONFIG_GPIO_PIN5_OFFSET=9
CONFIG_GPIO_PIN6_OFFSET=10
CONFIG_GPIO_PIN7_OFFSET=11
CONFIG_GPIO_PIN_NUM=8
CONFIG_GPIO_PIN_MAP={ CONFIG_GPIO_PIN0_OFFSET, CONFIG_GPIO_PIN1_OFFSET, CONFIG_GPIO_PIN2_OFFSET, CONFIG_GPIO_PIN3_OFFSET, CONFIG_GPIO_PIN4_OFFSET, CONFIG_GPIO_PIN5_OFFSET, CONFIG_GPIO_PIN6_OFFSET, CONFIG_GPIO_PIN7_OFFSET }



