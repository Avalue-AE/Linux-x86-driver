
# =================================
# ESM-ASLC Board Configuration File
# =================================
CONFIG_BOARD_NAME="ESM-ASLC"

# ------------------------------------------------------------------
# STATUS: NOT HARDWARE-VALIDATED
# Auto-ported from the legacy driver (Avalue_driver_deprecate/config).
# Passes config.sh/build checks only; NOT yet verified on real hardware.
# Confirm every "# TODO verify" value (CHIPID, voltage LSB, threm_* and
# other channels) on the bench before relying on this board.
# ------------------------------------------------------------------

# Ported from esm_aslc_init() in Avalue_driver_deprecate/config/config.c
# (~line 3527). Chipset is fun_ctl_type_it85x8 (ITE EC) for wdt/pwm/vin/
# temp/fan -> maps to the ec/ite HAL here.
#
# Omitted (no HAL / no data in this project, per Rule 4):
#   - lvds[] (lvds_fqy, lvds_mode, lvds_type)  -> no LVDS HAL here.
#   - fan_mode[] (fan_cpu)                     -> no fan-mode HAL here.
#   - dio_ctl_smbus_init(..., fun_ctl_type_none, fun_ctl_type_none, &dio_none)
#                                               -> board has no DIO ("not
#                                                  support yet" in legacy code).
#   - MISC / COM-mode registers                -> config.c carries no
#                                                  per-board MISC channel
#                                                  table for this board.

# ==================================
# ===== Watchdog Configuration =====
# ==================================
MAKE_WDT_DEVICE=ec
MAKE_WDT_CHIPSET=ite
CONFIG_WDT_CHIPSET=ite
# TODO verify: legacy stores chip type (it85x8), not the numeric CHIPID.
CONFIG_CHIPID=0x5782


# ==========================================
# ===== Hardware Monitor Configuration =====
# ==========================================
MAKE_HWM_DEVICE=ec
MAKE_HWM_CHIPSET=ite
CONFIG_HWM_CHIPSET=ite

# ===== Hardware Monitor Voltage Configuration =====
#define ITE_REG_HWM_VOLTAGE(n) (0x30 + (n))
# Legacy vin[] = { sensor_vin, sensor_vcore, threm_cpu, sensor_ddr_threm_sys }
# legacy vin_vr[] = { vr_def, vr_200_22, vr_def, vr_def, vr_def } (5th unused,
# ARRAY_SIZE(vin) = 4). threm_cpu and sensor_ddr_threm_sys are real EC
# voltage channels (read through the EC voltage register block) -> enabled,
# not disabled, per the threm_* rule.
# ITE volt step = legacy 117/10 mV; TODO verify on hardware.

CONFIG_HWM_VOLTAGE_0_ENABLE=1
CONFIG_HWM_VOLTAGE_0_REG=ITE_REG_HWM_VOLTAGE(0)
CONFIG_HWM_VOLTAGE_0_LABEL="VIN"
CONFIG_HWM_VOLTAGE_0_LSB=12
# R1/R2 confirmed off the schematic.
CONFIG_HWM_VOLTAGE_0_R1=200000
CONFIG_HWM_VOLTAGE_0_R2=22000

CONFIG_HWM_VOLTAGE_1_ENABLE=1
CONFIG_HWM_VOLTAGE_1_REG=ITE_REG_HWM_VOLTAGE(1)
CONFIG_HWM_VOLTAGE_1_LABEL="VCORE"
CONFIG_HWM_VOLTAGE_1_LSB=12
CONFIG_HWM_VOLTAGE_1_R1=200000
CONFIG_HWM_VOLTAGE_1_R2=22000

CONFIG_HWM_VOLTAGE_2_ENABLE=1
CONFIG_HWM_VOLTAGE_2_REG=ITE_REG_HWM_VOLTAGE(2)
CONFIG_HWM_VOLTAGE_2_LABEL="Threm_Cpu"
CONFIG_HWM_VOLTAGE_2_LSB=12
CONFIG_HWM_VOLTAGE_2_R1=0
CONFIG_HWM_VOLTAGE_2_R2=0

CONFIG_HWM_VOLTAGE_3_ENABLE=1
CONFIG_HWM_VOLTAGE_3_REG=ITE_REG_HWM_VOLTAGE(3)
CONFIG_HWM_VOLTAGE_3_LABEL="DDR_Threm_Sys"
CONFIG_HWM_VOLTAGE_3_LSB=12
CONFIG_HWM_VOLTAGE_3_R1=0
CONFIG_HWM_VOLTAGE_3_R2=0

# vin[] has no index 4 element (ARRAY_SIZE(vin) = 4) -> not populated.
CONFIG_HWM_VOLTAGE_4_ENABLE=0

# Fixed to 5 voltage sensors for ITE
CONFIG_HWM_VOLTAGE_NUM=5
CONFIG_HWM_VOLTAGE_MAP={ CONFIG_HWM_VOLTAGE_0_ENABLE, CONFIG_HWM_VOLTAGE_1_ENABLE, CONFIG_HWM_VOLTAGE_2_ENABLE, CONFIG_HWM_VOLTAGE_3_ENABLE, CONFIG_HWM_VOLTAGE_4_ENABLE }


# ===== Hardware Monitor Temperature Configuration =====
#define ITE_REG_HWM_TEMPERATURE(n) (0x3B + (n))
# Legacy temp[] = { temp_cpu }

CONFIG_HWM_TEMPERATURE_0_ENABLE=1
CONFIG_HWM_TEMPERATURE_0_REG=ITE_REG_HWM_TEMPERATURE(0)
CONFIG_HWM_TEMPERATURE_0_LABEL="CPU"

CONFIG_HWM_TEMPERATURE_1_ENABLE=0
CONFIG_HWM_TEMPERATURE_2_ENABLE=0

# Fixed to 3 temperature sensors for ITE
CONFIG_HWM_TEMPERATURE_NUM=3
CONFIG_HWM_TEMPERATURE_MAP={ CONFIG_HWM_TEMPERATURE_0_ENABLE, CONFIG_HWM_TEMPERATURE_1_ENABLE, CONFIG_HWM_TEMPERATURE_2_ENABLE }

# ===== Hardware Monitor Fan Configuration =====
#define ITE_REG_HWM_FAN_SPEED(n) (0x35 + (n) * 2)
# Legacy fan[] = { fan_cpu }  -> single populated entry at index 0.

CONFIG_HWM_FAN_0_ENABLE=1
# Fan tach is at 0x39/0x3A per the EC BRAM map (0x35 = ADC5, not fan)
CONFIG_HWM_FAN_0_REG_SPEED=ITE_REG_HWM_FAN_SPEED(2)
CONFIG_HWM_FAN_0_LABEL="CPU Fan"
CONFIG_HWM_FAN_0_SPEED_STEP=1

CONFIG_HWM_FAN_1_ENABLE=0

# Fixed to 2 fan sensors for ITE
CONFIG_HWM_FAN_NUM=2
CONFIG_HWM_FAN_MAP={ CONFIG_HWM_FAN_0_ENABLE, CONFIG_HWM_FAN_1_ENABLE }

# ===== Hardware Monitor PWM Configuration =====
#define ITE_REG_HWM_PWM(n) (0x40 + (n))
# Legacy pwm[] = { backlight, fan_cpu }

CONFIG_HWM_PWM_0_ENABLE=1
CONFIG_HWM_PWM_0_REG=ITE_REG_HWM_PWM(0)
CONFIG_HWM_PWM_0_LABEL="Backlight"

CONFIG_HWM_PWM_1_ENABLE=1
CONFIG_HWM_PWM_1_REG=ITE_REG_HWM_PWM(1)
CONFIG_HWM_PWM_1_LABEL="CPU Fan PWM"

CONFIG_HWM_PWM_2_ENABLE=0
CONFIG_HWM_PWM_3_ENABLE=0
CONFIG_HWM_PWM_4_ENABLE=0
CONFIG_HWM_PWM_5_ENABLE=0


CONFIG_HWM_PWM_NUM=6
CONFIG_HWM_PWM_MAP={ CONFIG_HWM_PWM_0_ENABLE, CONFIG_HWM_PWM_1_ENABLE, CONFIG_HWM_PWM_2_ENABLE, CONFIG_HWM_PWM_3_ENABLE, CONFIG_HWM_PWM_4_ENABLE, CONFIG_HWM_PWM_5_ENABLE }


# ==============================
# ===== GPIO Configuration =====
# ==============================
# NOT HARDWARE-VALIDATED (bench loopback pending) but sourced from the
# official ESM-ASLC EC BRAM map: GPIO is EC-native (ITE it85x8 EC, read via
# its BRAM window) -> ec/ite HAL, no MAKE_GPIO_PROTOCOL. Fixed direction,
# BRAM 0x5A[3:0]=4 GPI inputs, 0x5B[3:0]=4 GPO outputs.
MAKE_GPIO_DEVICE=ec
MAKE_GPIO_CHIPSET=ite

CONFIG_GPIO_DIR_FIXED=1
CONFIG_GPIO_REG_INPUT=0x5A
CONFIG_GPIO_REG_OUTPUT=0x5B
CONFIG_GPIO_DIR_MASK=0xF0

CONFIG_GPIO_PIN0_OFFSET=0
CONFIG_GPIO_PIN1_OFFSET=1
CONFIG_GPIO_PIN2_OFFSET=2
CONFIG_GPIO_PIN3_OFFSET=3
CONFIG_GPIO_PIN4_OFFSET=0
CONFIG_GPIO_PIN5_OFFSET=1
CONFIG_GPIO_PIN6_OFFSET=2
CONFIG_GPIO_PIN7_OFFSET=3
CONFIG_GPIO_PIN_NUM=8
CONFIG_GPIO_PIN_MAP={ CONFIG_GPIO_PIN0_OFFSET, CONFIG_GPIO_PIN1_OFFSET, CONFIG_GPIO_PIN2_OFFSET, CONFIG_GPIO_PIN3_OFFSET, CONFIG_GPIO_PIN4_OFFSET, CONFIG_GPIO_PIN5_OFFSET, CONFIG_GPIO_PIN6_OFFSET, CONFIG_GPIO_PIN7_OFFSET }

