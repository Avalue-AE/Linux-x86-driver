
# ================================
# NCM-TGU Board Configuration File
# ================================
CONFIG_BOARD_NAME="NCM-TGU"

# ------------------------------------------------------------------
# STATUS: NOT HARDWARE-VALIDATED
# Auto-ported from the legacy driver (Avalue_driver_deprecate/config).
# Passes config.sh/build checks only; NOT yet verified on real hardware.
# Confirm every "# TODO verify" value (CHIPID, voltage LSB, threm_* and
# other channels) on the bench before relying on this board.
