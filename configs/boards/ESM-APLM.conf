CONFIG_HWM_PWM_0_LABEL="CPU Fan"

CONFIG_HWM_PWM_1_ENABLE=0

CONFIG_HWM_PWM_2_ENABLE=1
CONFIG_HWM_PWM_2_REG=ITE_REG_HWM_PWM(2)
CONFIG_HWM_PWM_2_LABEL="Backlight"

CONFIG_HWM_PWM_3_ENABLE=0
CONFIG_HWM_PWM_4_ENABLE=0
CONFIG_HWM_PWM_5_ENABLE=0

CONFIG_HWM_PWM_NUM=6
CONFIG_HWM_PWM_MAP={ CONFIG_HWM_PWM_0_ENABLE, CONFIG_HWM_PWM_1_ENABLE, CONFIG_HWM_PWM_2_ENABLE, CONFIG_HWM_PWM_3_ENABLE, CONFIG_HWM_PWM_4_ENABLE, CONFIG_HWM_PWM_5_ENABLE }


# ==============================
# ===== Omitted subsystems =====
# ==============================
# GPIO: legacy esm_aplm_init() calls
#   dio_ctl_ec_init(&config->dio, 0x58, 0x59, 0x5A, fun_ctl_type_it85x8, fun_ctl_type_ec, &dio_type_4_4);
# i.e. GPIO driven directly through the ITE EC chip's own GPI/GPO registers
# (0x58/0x59/0x5A), not the pca9555 SMBus expander and not nct5655 either.
# The only GPIO HAL in this project is smb/nct5655; an EC-direct GPIO block
# is a different mechanism with no matching HAL here. Do not fabricate
# nct5655 GPIO keys for it - omitted.
#
# LVDS: legacy declares lvds[] = { lvds_fqy, lvds_mode, lvds_type } and calls
# fun_ctl_init(&config->lvds, ...). There is no LVDS HAL in this project -
# omitted (Rule 4).
#
# Fan mode: legacy declares fan_mode[] = { fan_cpu } and calls
# fun_ctl_init(&config->fan_mode, ...). There is no fan-mode HAL in this
# project - omitted (Rule 4).
#
# MISC: config.c carries no per-board MISC channel table for this board
# (the legacy ec_misc is a generic 1-register stub, not board-specific data).
# MISC is separate work - omitted (Rule 4).


# ==============================
# ===== GPIO Configuration =====
# ==============================
# pca9555 SMBus GPIO expander via the i801 host controller.
# Ported from legacy esm_aplm_init() dio_type_8_8: 8 input lines on
# port 0 (offsets 0..7) + 8 output lines on port 1
# (offsets 8..15). Single chip at slave_addr1; base
# port auto-detected. # TODO verify pin offsets / slave address on HW
MAKE_GPIO_DEVICE=smb
MAKE_GPIO_PROTOCOL=i801
MAKE_GPIO_CHIPSET=pca9555

CONFIG_SMBUS_BASE_PORT=0x0000
CONFIG_SMBUS_SLAVE_ADDR1=0x40
CONFIG_SMBUS_SLAVE_ADDR2=0x40

CONFIG_GPIO_PIN0_OFFSET=0
CONFIG_GPIO_PIN1_OFFSET=1
CONFIG_GPIO_PIN2_OFFSET=2
CONFIG_GPIO_PIN3_OFFSET=3
CONFIG_GPIO_PIN4_OFFSET=4
CONFIG_GPIO_PIN5_OFFSET=5
CONFIG_GPIO_PIN6_OFFSET=6
CONFIG_GPIO_PIN7_OFFSET=7
CONFIG_GPIO_PIN8_OFFSET=8
CONFIG_GPIO_PIN9_OFFSET=9
CONFIG_GPIO_PIN10_OFFSET=10
CONFIG_GPIO_PIN11_OFFSET=11
CONFIG_GPIO_PIN12_OFFSET=12
CONFIG_GPIO_PIN13_OFFSET=13
CONFIG_GPIO_PIN14_OFFSET=14
CONFIG_GPIO_PIN15_OFFSET=15
CONFIG_GPIO_PIN_NUM=16
CONFIG_GPIO_PIN_MAP={ CONFIG_GPIO_PIN0_OFFSET, CONFIG_GPIO_PIN1_OFFSET, CONFIG_GPIO_PIN2_OFFSET, CONFIG_GPIO_PIN3_OFFSET, CONFIG_GPIO_PIN4_OFFSET, CONFIG_GPIO_PIN5_OFFSET, CONFIG_GPIO_PIN6_OFFSET, CONFIG_GPIO_PIN7_OFFSET, CONFIG_GPIO_PIN8_OFFSET, CONFIG_GPIO_PIN9_OFFSET, CONFIG_GPIO_PIN10_OFFSET, CONFIG_GPIO_PIN11_OFFSET, CONFIG_GPIO_PIN12_OFFSET, CONFIG_GPIO_PIN13_OFFSET, CONFIG_GPIO_PIN14_OFFSET, CONFIG_GPIO_PIN15_OFFSET }
