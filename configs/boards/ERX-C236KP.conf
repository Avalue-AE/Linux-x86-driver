# ================================
# ERX-C236KP Board Configuration File
# ================================
# ------------------------------------------------------------------
# STATUS: NOT HARDWARE-VALIDATED
# Ported from the legacy driver (erx_c236kp_init() in
# Avalue_driver_deprecate/config/config.c), now that the nct61x6d SIO HAL
# exists. WDT + Hardware Monitor are wired to the Nuvoton NCT61x6D super-I/O.
# Confirm every "# TODO verify" value (CHIPID, voltage LSB, channel labels)
# on the bench before relying on this board.
# ------------------------------------------------------------------
CONFIG_BOARD_NAME="ERX-C236KP"

# ==================================
# ===== Watchdog Configuration =====
# ==================================
MAKE_WDT_DEVICE=sio
MAKE_WDT_CHIPSET=nct61x6d
CONFIG_WDT_CHIPSET=nct61x6d
# TODO verify: NCT6106D (0xC4xx) vs NCT6126D (0xD2xx); probe auto-detects
CONFIG_CHIPID=0xD282

# ==========================================
# ===== Hardware Monitor Configuration =====
# ==========================================
MAKE_HWM_DEVICE=sio
MAKE_HWM_CHIPSET=nct61x6d
CONFIG_HWM_CHIPSET=nct61x6d

# ===== Voltage (NCT61x6D SIO: reported = raw * LSB, no divider) =====
# Legacy vr r1 encodes the mV/count step; R1=R2=0 (no 4.x divider).

CONFIG_HWM_VOLTAGE_0_ENABLE=1
CONFIG_HWM_VOLTAGE_0_REG=0x00
CONFIG_HWM_VOLTAGE_0_LABEL="VCORE"
CONFIG_HWM_VOLTAGE_0_LSB=8
CONFIG_HWM_VOLTAGE_0_R1=0
CONFIG_HWM_VOLTAGE_0_R2=0

CONFIG_HWM_VOLTAGE_1_ENABLE=1
CONFIG_HWM_VOLTAGE_1_REG=0x01
CONFIG_HWM_VOLTAGE_1_LABEL="V12"
CONFIG_HWM_VOLTAGE_1_LSB=110
CONFIG_HWM_VOLTAGE_1_R1=0
CONFIG_HWM_VOLTAGE_1_R2=0

CONFIG_HWM_VOLTAGE_2_ENABLE=1
CONFIG_HWM_VOLTAGE_2_REG=0x04
CONFIG_HWM_VOLTAGE_2_LABEL="V5"
CONFIG_HWM_VOLTAGE_2_LSB=40
CONFIG_HWM_VOLTAGE_2_R1=0
CONFIG_HWM_VOLTAGE_2_R2=0

CONFIG_HWM_VOLTAGE_3_ENABLE=1
CONFIG_HWM_VOLTAGE_3_REG=0x05
CONFIG_HWM_VOLTAGE_3_LABEL="VDRAM"
CONFIG_HWM_VOLTAGE_3_LSB=8
CONFIG_HWM_VOLTAGE_3_R1=0
CONFIG_HWM_VOLTAGE_3_R2=0

CONFIG_HWM_VOLTAGE_4_ENABLE=1
CONFIG_HWM_VOLTAGE_4_REG=0x02
CONFIG_HWM_VOLTAGE_4_LABEL="AVCC"
CONFIG_HWM_VOLTAGE_4_LSB=16
CONFIG_HWM_VOLTAGE_4_R1=0
CONFIG_HWM_VOLTAGE_4_R2=0

CONFIG_HWM_VOLTAGE_5_ENABLE=1
CONFIG_HWM_VOLTAGE_5_REG=0x07
CONFIG_HWM_VOLTAGE_5_LABEL="3VSB"
CONFIG_HWM_VOLTAGE_5_LSB=16
CONFIG_HWM_VOLTAGE_5_R1=0
CONFIG_HWM_VOLTAGE_5_R2=0

CONFIG_HWM_VOLTAGE_6_ENABLE=1
CONFIG_HWM_VOLTAGE_6_REG=0x03
CONFIG_HWM_VOLTAGE_6_LABEL="3VCC"
CONFIG_HWM_VOLTAGE_6_LSB=16
CONFIG_HWM_VOLTAGE_6_R1=0
CONFIG_HWM_VOLTAGE_6_R2=0

CONFIG_HWM_VOLTAGE_7_ENABLE=0

CONFIG_HWM_VOLTAGE_NUM=8
CONFIG_HWM_VOLTAGE_MAP={ CONFIG_HWM_VOLTAGE_0_ENABLE, CONFIG_HWM_VOLTAGE_1_ENABLE, CONFIG_HWM_VOLTAGE_2_ENABLE, CONFIG_HWM_VOLTAGE_3_ENABLE, CONFIG_HWM_VOLTAGE_4_ENABLE, CONFIG_HWM_VOLTAGE_5_ENABLE, CONFIG_HWM_VOLTAGE_6_ENABLE, CONFIG_HWM_VOLTAGE_7_ENABLE }

# ===== Temperature =====

CONFIG_HWM_TEMPERATURE_0_ENABLE=1
CONFIG_HWM_TEMPERATURE_0_REG=0x10
CONFIG_HWM_TEMPERATURE_0_LABEL="CPU"

CONFIG_HWM_TEMPERATURE_1_ENABLE=0

CONFIG_HWM_TEMPERATURE_2_ENABLE=1
CONFIG_HWM_TEMPERATURE_2_REG=0x12
CONFIG_HWM_TEMPERATURE_2_LABEL="System"

CONFIG_HWM_TEMPERATURE_NUM=3
CONFIG_HWM_TEMPERATURE_MAP={ CONFIG_HWM_TEMPERATURE_0_ENABLE, CONFIG_HWM_TEMPERATURE_1_ENABLE, CONFIG_HWM_TEMPERATURE_2_ENABLE }

# ===== Fan (RPM = 1350000 / raw count) =====

CONFIG_HWM_FAN_0_ENABLE=1
CONFIG_HWM_FAN_0_REG_SPEED=0x32
CONFIG_HWM_FAN_0_LABEL="CPU Fan"
CONFIG_HWM_FAN_0_SPEED_STEP=1350000

CONFIG_HWM_FAN_1_ENABLE=1
CONFIG_HWM_FAN_1_REG_SPEED=0x30
CONFIG_HWM_FAN_1_LABEL="System Fan 1"
CONFIG_HWM_FAN_1_SPEED_STEP=1350000

CONFIG_HWM_FAN_2_ENABLE=1
CONFIG_HWM_FAN_2_REG_SPEED=0x34
CONFIG_HWM_FAN_2_LABEL="System Fan 2"
CONFIG_HWM_FAN_2_SPEED_STEP=1350000

CONFIG_HWM_FAN_NUM=3
CONFIG_HWM_FAN_MAP={ CONFIG_HWM_FAN_0_ENABLE, CONFIG_HWM_FAN_1_ENABLE, CONFIG_HWM_FAN_2_ENABLE }

# ===== PWM =====

CONFIG_HWM_PWM_0_ENABLE=0

CONFIG_HWM_PWM_1_ENABLE=0

CONFIG_HWM_PWM_NUM=2
CONFIG_HWM_PWM_MAP={ CONFIG_HWM_PWM_0_ENABLE, CONFIG_HWM_PWM_1_ENABLE }

# ==============================
# ===== GPIO Configuration =====
# ==============================
# pca9555 SMBus GPIO expander via the i801 host controller.
# Ported from legacy erx_c236kp_init() dio_type_8_8: 8 input lines on
# port 0 (offsets 0..7) + 8 output lines on port 1
# (offsets 8..15). Single chip at slave_addr1; base
# port auto-detected. # TODO verify pin offsets / slave address on HW
MAKE_GPIO_DEVICE=smb
MAKE_GPIO_PROTOCOL=i801
MAKE_GPIO_CHIPSET=pca9555

CONFIG_SMBUS_BASE_PORT=0x0000
CONFIG_SMBUS_SLAVE_ADDR1=0x40
CONFIG_SMBUS_SLAVE_ADDR2=0x40

CONFIG_GPIO_PIN0_OFFSET=0
CONFIG_GPIO_PIN1_OFFSET=1
CONFIG_GPIO_PIN2_OFFSET=2
CONFIG_GPIO_PIN3_OFFSET=3
CONFIG_GPIO_PIN4_OFFSET=4
CONFIG_GPIO_PIN5_OFFSET=5
CONFIG_GPIO_PIN6_OFFSET=6
CONFIG_GPIO_PIN7_OFFSET=7
CONFIG_GPIO_PIN8_OFFSET=8
CONFIG_GPIO_PIN9_OFFSET=9
CONFIG_GPIO_PIN10_OFFSET=10
CONFIG_GPIO_PIN11_OFFSET=11
CONFIG_GPIO_PIN12_OFFSET=12
CONFIG_GPIO_PIN13_OFFSET=13
CONFIG_GPIO_PIN14_OFFSET=14
CONFIG_GPIO_PIN15_OFFSET=15
CONFIG_GPIO_PIN_NUM=16
CONFIG_GPIO_PIN_MAP={ CONFIG_GPIO_PIN0_OFFSET, CONFIG_GPIO_PIN1_OFFSET, CONFIG_GPIO_PIN2_OFFSET, CONFIG_GPIO_PIN3_OFFSET, CONFIG_GPIO_PIN4_OFFSET, CONFIG_GPIO_PIN5_OFFSET, CONFIG_GPIO_PIN6_OFFSET, CONFIG_GPIO_PIN7_OFFSET, CONFIG_GPIO_PIN8_OFFSET, CONFIG_GPIO_PIN9_OFFSET, CONFIG_GPIO_PIN10_OFFSET, CONFIG_GPIO_PIN11_OFFSET, CONFIG_GPIO_PIN12_OFFSET, CONFIG_GPIO_PIN13_OFFSET, CONFIG_GPIO_PIN14_OFFSET, CONFIG_GPIO_PIN15_OFFSET }
