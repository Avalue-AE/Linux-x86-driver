# ==============================
# ===== Omitted subsystems =====
# ==============================
# GPIO: legacy uses dio_ctl_smbus_init(..., fun_ctl_type_pca9555, fun_ctl_type_i801, &dio_type_4_4)
#   -> pca9555 DIO expander has no HAL in this project (only nct5655 is supported).
#   Omitted; do not fabricate nct5655 GPIO keys for a pca9555 board (Rule 4).
#
# LVDS: legacy lvds[] = { lvds_fqy, lvds_mode, lvds_type } -> no LVDS HAL here. Omitted (Rule 4).
#
# Fan mode: legacy fan_mode[] = { fan_cpu } -> no fan-mode HAL here. Omitted (Rule 4).
#
# MISC: vms_apl_init() never calls fun_ctl_init(&config->misc, ...) -- the legacy board
#   defines no MISC/COM-mode register table at all. Omitted (Rule 4).


# ==============================
# ===== GPIO Configuration =====
# ==============================
# NOT HARDWARE-VALIDATED (bench loopback pending) but sourced from the
# official VMS-APL EC BRAM map: GPIO is EC-native (ITE it85x8 EC, read via
# its BRAM window) -> ec/ite HAL, no MAKE_GPIO_PROTOCOL. Fixed direction,
# single register BRAM 0x52[7:0] = 4in-4out; [7:4]=inputs, [3:0]=outputs
# (# TODO verify nibble split). NB: legacy drove a pca9555 SMBus expander
# for this board; the EC BRAM path above is what the firmware map documents.
MAKE_GPIO_DEVICE=ec
MAKE_GPIO_CHIPSET=ite

CONFIG_GPIO_DIR_FIXED=1
CONFIG_GPIO_REG_INPUT=0x52
CONFIG_GPIO_REG_OUTPUT=0x52
CONFIG_GPIO_DIR_MASK=0xF0

CONFIG_GPIO_PIN0_OFFSET=4
CONFIG_GPIO_PIN1_OFFSET=5
CONFIG_GPIO_PIN2_OFFSET=6
CONFIG_GPIO_PIN3_OFFSET=7
CONFIG_GPIO_PIN4_OFFSET=0
CONFIG_GPIO_PIN5_OFFSET=1
CONFIG_GPIO_PIN6_OFFSET=2
CONFIG_GPIO_PIN7_OFFSET=3
CONFIG_GPIO_PIN_NUM=8
CONFIG_GPIO_PIN_MAP={ CONFIG_GPIO_PIN0_OFFSET, CONFIG_GPIO_PIN1_OFFSET, CONFIG_GPIO_PIN2_OFFSET, CONFIG_GPIO_PIN3_OFFSET, CONFIG_GPIO_PIN4_OFFSET, CONFIG_GPIO_PIN5_OFFSET, CONFIG_GPIO_PIN6_OFFSET, CONFIG_GPIO_PIN7_OFFSET }
