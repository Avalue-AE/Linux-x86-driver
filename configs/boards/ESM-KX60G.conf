# ==============================
# ===== GPIO Configuration =====
# ==============================
# HARDWARE-VALIDATED: 4-pair jumper loopback (GPI0<->GPO4, GPI1<->GPO5,
# GPI2<->GPO6, GPI3<->GPO7) passed on real hardware. Sourced from
# the official ESM-KX60G EC BRAM map, not guessed: GPIO here is EC-native
# (through the on-board ITE it85x8 EC, read via its BRAM window), so it uses
# the ec/ite GPIO HAL with no MAKE_GPIO_PROTOCOL. The EC exposes a fixed
# split of 4 inputs and 4 outputs (no direction register):
#   BRAM 0x5A [3:0]  GPI  - 4 input lines
#   BRAM 0x5B [3:0]  GPO  - 4 output lines (write 1/0 = high/low)
# Model: fixed direction, separate input/output banks.
# A write to CONFIG_GPIO_REG_OUTPUT on this board needs the poll-for-readback
# retry in src/hal/ec/ite_gpio.c (hal_gpio_lock): this EC's own mirror of
# 0x5B can lag a write by up to ~110ms with no ready/busy bit to poll instead
# - a hardware fact to account for, not a driver bug left to fix further.
MAKE_GPIO_DEVICE=ec
MAKE_GPIO_CHIPSET=ite

# Fixed-direction, split banks: 0x5A = input, 0x5B = output
CONFIG_GPIO_DIR_FIXED=1
CONFIG_GPIO_REG_INPUT=0x5A
CONFIG_GPIO_REG_OUTPUT=0x5B
# Logical pins 4-7 are the outputs (bit per pin); 0-3 are inputs
CONFIG_GPIO_DIR_MASK=0xF0

# Pins 0-3: GPI bits 0-3 of 0x5A.  Pins 4-7: GPO bits 0-3 of 0x5B.
CONFIG_GPIO_PIN0_OFFSET=0
CONFIG_GPIO_PIN1_OFFSET=1
CONFIG_GPIO_PIN2_OFFSET=2
CONFIG_GPIO_PIN3_OFFSET=3
CONFIG_GPIO_PIN4_OFFSET=0
CONFIG_GPIO_PIN5_OFFSET=1
CONFIG_GPIO_PIN6_OFFSET=2
CONFIG_GPIO_PIN7_OFFSET=3
CONFIG_GPIO_PIN_NUM=8
CONFIG_GPIO_PIN_MAP={ CONFIG_GPIO_PIN0_OFFSET, CONFIG_GPIO_PIN1_OFFSET, CONFIG_GPIO_PIN2_OFFSET, CONFIG_GPIO_PIN3_OFFSET, CONFIG_GPIO_PIN4_OFFSET, CONFIG_GPIO_PIN5_OFFSET, CONFIG_GPIO_PIN6_OFFSET, CONFIG_GPIO_PIN7_OFFSET }
# ==============================
# ===== MISC Configuration =====
# ==============================
# BRAM 0x4B is EC firmware version, read-only, confirmed against the official
# ESM-KX60G_EC_BRAM_map.txt line 37 ("4B  R  EC firmware version") - a direct
# citation, not a guess, so it carries no "# TODO verify" tag. The
# "MISC omitted" note this section replaces was about the legacy 3.x
# esm_kx60g_init() never wiring a MISC channel table (config.c has no
# per-board MISC table to port from) - it does not mean this board has no
# ad-hoc register worth exposing.
MAKE_MISC_DEVICE=ec
MAKE_MISC_CHIPSET=ite

# ioctl magic (single-quoted char literal)
CONFIG_MISC_IOCTL_BASE='A'

CONFIG_MISC_0_ENABLE=1
CONFIG_MISC_0_REG=0x4B
CONFIG_MISC_0_MASK=0xFF
CONFIG_MISC_0_IOR=_IOR(CONFIG_MISC_IOCTL_BASE, CONFIG_MISC_0_REG, u32)
# Read-only per BRAM map ("R") - 0 makes hal_misc_write's __misc_store return -EACCES
CONFIG_MISC_0_IOW=0
CONFIG_MISC_0_LABEL="EC_FW_Version"

CONFIG_MISC_1_ENABLE=0
CONFIG_MISC_2_ENABLE=0
CONFIG_MISC_3_ENABLE=0
CONFIG_MISC_4_ENABLE=0
CONFIG_MISC_5_ENABLE=0
CONFIG_MISC_6_ENABLE=0
CONFIG_MISC_7_ENABLE=0
CONFIG_MISC_8_ENABLE=0
CONFIG_MISC_9_ENABLE=0

CONFIG_MISC_NUM=10
CONFIG_MISC_MAP={ CONFIG_MISC_0_ENABLE, CONFIG_MISC_1_ENABLE, CONFIG_MISC_2_ENABLE, CONFIG_MISC_3_ENABLE, CONFIG_MISC_4_ENABLE, CONFIG_MISC_5_ENABLE, CONFIG_MISC_6_ENABLE, CONFIG_MISC_7_ENABLE, CONFIG_MISC_8_ENABLE, CONFIG_MISC_9_ENABLE }
