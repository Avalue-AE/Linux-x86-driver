# ------------------------------------------------------------------
# STATUS: HARDWARE-VALIDATED (initial bench test 2026-07-07)
# Auto-ported from the legacy driver (Avalue_driver_deprecate/config).
#   WDT  - bench-tested OK (initial functional pass)
#   HWM  - bench-tested OK (initial functional pass); cross-module EC
#          index+data port contention fixed and stress-confirmed:
#          fan1_input tach anomalies went from 19-27 per ~1200 reads to
#          0 per 1185 reads once the port pair was muxed across modules
#   GPIO - bench-tested OK: 4-pair jumper loopback (GPI0<->GPO4,
#          GPI1<->GPO5, GPI2<->GPO6, GPI3<->GPO7) passed on real
#          hardware; needed a write/readback mutex fix in
#          src/hal/ec/ite_gpio.c (hal_gpio_lock), see GPIO section below
# WDT, HWM and GPIO have all now been bench-tested OK on real hardware,
# but the individual "# TODO verify" values below (CHIPID, voltage LSB,
# threm_* and other channels) are NOT yet metrologically confirmed
# against known rails - keep verifying each before relying on this board.
# ------------------------------------------------------------------

