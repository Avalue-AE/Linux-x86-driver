# ECM-PTL board configuration
CONFIG_BOARD_NAME="ECM-PTL"

# STATUS: HARDWARE-VALIDATED (bench test 2026-09-15, kernel 7.0.0-31-generic)
# HWM voltage, temperature, tachometer and PWM read-back worked on ECM-PTL.
# Smart Fan duty changed from 100% to 60%, tachometer RPM fell, and duty was
# restored. The 16-line GPIO driver registered and connected loopback pairs
# passed in both directions.
# MISC channels read successfully. WDT armed, counted down and refreshed on
# ping; nowayout=1 kept it active after magic close, so a reset was expected.
# Plausible sensor readings do not independently calibrate the 12 mV ADC step.

MAKE_WDT_DEVICE=ec
MAKE_WDT_CHIPSET=ite
CONFIG_WDT_CHIPSET=ite
CONFIG_CHIPID=0x5782

MAKE_HWM_DEVICE=ec
MAKE_HWM_CHIPSET=ite
CONFIG_HWM_CHIPSET=ite

# BOARD_ID is a board-identification ADC at 0x36, exposed as a raw MISC byte.
# The 12 mV ADC step follows adjacent IT5782 board configs; verify it against
# a known rail before using the reading as a calibrated measurement. ADC0 and
# ADC7 are unused; VDDR/VBAT need separate checks.
CONFIG_HWM_VOLTAGE_0_ENABLE=0
CONFIG_HWM_VOLTAGE_1_ENABLE=1
CONFIG_HWM_VOLTAGE_1_REG=0x31
CONFIG_HWM_VOLTAGE_1_LABEL="SENSOR_VIN"
CONFIG_HWM_VOLTAGE_1_LSB=12
CONFIG_HWM_VOLTAGE_1_R1=200000
CONFIG_HWM_VOLTAGE_1_R2=16900
CONFIG_HWM_VOLTAGE_2_ENABLE=1
CONFIG_HWM_VOLTAGE_2_REG=0x32
CONFIG_HWM_VOLTAGE_2_LABEL="SENSOR_VCORE"
CONFIG_HWM_VOLTAGE_2_LSB=12
CONFIG_HWM_VOLTAGE_2_R1=0
CONFIG_HWM_VOLTAGE_2_R2=0
CONFIG_HWM_VOLTAGE_3_ENABLE=1
CONFIG_HWM_VOLTAGE_3_REG=0x33
CONFIG_HWM_VOLTAGE_3_LABEL="THREM_CPU"
CONFIG_HWM_VOLTAGE_3_LSB=12
CONFIG_HWM_VOLTAGE_3_R1=0
CONFIG_HWM_VOLTAGE_3_R2=0
CONFIG_HWM_VOLTAGE_4_ENABLE=1
CONFIG_HWM_VOLTAGE_4_REG=0x34
CONFIG_HWM_VOLTAGE_4_LABEL="THREM_SYS"
CONFIG_HWM_VOLTAGE_4_LSB=12
CONFIG_HWM_VOLTAGE_4_R1=0
CONFIG_HWM_VOLTAGE_4_R2=0
CONFIG_HWM_VOLTAGE_5_ENABLE=0
CONFIG_HWM_VOLTAGE_6_ENABLE=0
CONFIG_HWM_VOLTAGE_7_ENABLE=0
CONFIG_HWM_VOLTAGE_NUM=8
CONFIG_HWM_VOLTAGE_MAP={ CONFIG_HWM_VOLTAGE_0_ENABLE, CONFIG_HWM_VOLTAGE_1_ENABLE, CONFIG_HWM_VOLTAGE_2_ENABLE, CONFIG_HWM_VOLTAGE_3_ENABLE, CONFIG_HWM_VOLTAGE_4_ENABLE, CONFIG_HWM_VOLTAGE_5_ENABLE, CONFIG_HWM_VOLTAGE_6_ENABLE, CONFIG_HWM_VOLTAGE_7_ENABLE }

CONFIG_HWM_TEMPERATURE_0_ENABLE=1
CONFIG_HWM_TEMPERATURE_0_REG=0x3B
CONFIG_HWM_TEMPERATURE_0_LABEL="CPU Temp"
CONFIG_HWM_TEMPERATURE_1_ENABLE=1
CONFIG_HWM_TEMPERATURE_1_REG=0x3C
CONFIG_HWM_TEMPERATURE_1_LABEL="System Temp"
CONFIG_HWM_TEMPERATURE_2_ENABLE=0
CONFIG_HWM_TEMPERATURE_NUM=3
CONFIG_HWM_TEMPERATURE_MAP={ CONFIG_HWM_TEMPERATURE_0_ENABLE, CONFIG_HWM_TEMPERATURE_1_ENABLE, CONFIG_HWM_TEMPERATURE_2_ENABLE }

# The high/low tach bytes at 0x39/0x3A are reported as FAN1 RPM.
CONFIG_HWM_FAN_0_ENABLE=1
CONFIG_HWM_FAN_0_REG_SPEED=0x39
CONFIG_HWM_FAN_0_LABEL="TACH0A (FAN1) RPM"
CONFIG_HWM_FAN_0_SPEED_STEP=1
CONFIG_HWM_FAN_1_ENABLE=0
CONFIG_HWM_FAN_NUM=2
CONFIG_HWM_FAN_MAP={ CONFIG_HWM_FAN_0_ENABLE, CONFIG_HWM_FAN_1_ENABLE }

# PWM_DCR9 and PWM_DCR8 support duty readback on this board.
CONFIG_HWM_PWM_WRITE_ONLY=0
CONFIG_HWM_PWM_0_ENABLE=1
CONFIG_HWM_PWM_0_REG=0x40
CONFIG_HWM_PWM_0_LABEL="PWM_DCR9 Backlight"
CONFIG_HWM_PWM_1_ENABLE=1
CONFIG_HWM_PWM_1_REG=0x41
CONFIG_HWM_PWM_1_LABEL="PWM_DCR8 Smart Fan"
CONFIG_HWM_PWM_2_ENABLE=0
CONFIG_HWM_PWM_3_ENABLE=0
CONFIG_HWM_PWM_4_ENABLE=0
CONFIG_HWM_PWM_5_ENABLE=0
CONFIG_HWM_PWM_NUM=6
CONFIG_HWM_PWM_MAP={ CONFIG_HWM_PWM_0_ENABLE, CONFIG_HWM_PWM_1_ENABLE, CONFIG_HWM_PWM_2_ENABLE, CONFIG_HWM_PWM_3_ENABLE, CONFIG_HWM_PWM_4_ENABLE, CONFIG_HWM_PWM_5_ENABLE }

# NCT5655 supplies 16 GPIO lines; all expose direction changes. The board
# uses eight input and eight output lines.
MAKE_GPIO_DEVICE=smb
MAKE_GPIO_PROTOCOL=i801
MAKE_GPIO_CHIPSET=nct5655
CONFIG_SMBUS_BASE_PORT=0x0000
# The ECM-PTL bench run registered the NCT5655 gpiochip at this address and
# passed the connected GPIO loopback pairs in both directions.
CONFIG_SMBUS_SLAVE_ADDR1=0x40
CONFIG_SMBUS_SLAVE_ADDR2=0x40
CONFIG_GPIO_PIN0_OFFSET=0
CONFIG_GPIO_PIN1_OFFSET=1
CONFIG_GPIO_PIN2_OFFSET=2
CONFIG_GPIO_PIN3_OFFSET=3
CONFIG_GPIO_PIN4_OFFSET=4
CONFIG_GPIO_PIN5_OFFSET=5
CONFIG_GPIO_PIN6_OFFSET=6
CONFIG_GPIO_PIN7_OFFSET=7
CONFIG_GPIO_PIN8_OFFSET=8
CONFIG_GPIO_PIN9_OFFSET=9
CONFIG_GPIO_PIN10_OFFSET=10
CONFIG_GPIO_PIN11_OFFSET=11
CONFIG_GPIO_PIN12_OFFSET=12
CONFIG_GPIO_PIN13_OFFSET=13
CONFIG_GPIO_PIN14_OFFSET=14
CONFIG_GPIO_PIN15_OFFSET=15
CONFIG_GPIO_PIN_NUM=16
CONFIG_GPIO_PIN_MAP={ CONFIG_GPIO_PIN0_OFFSET, CONFIG_GPIO_PIN1_OFFSET, CONFIG_GPIO_PIN2_OFFSET, CONFIG_GPIO_PIN3_OFFSET, CONFIG_GPIO_PIN4_OFFSET, CONFIG_GPIO_PIN5_OFFSET, CONFIG_GPIO_PIN6_OFFSET, CONFIG_GPIO_PIN7_OFFSET, CONFIG_GPIO_PIN8_OFFSET, CONFIG_GPIO_PIN9_OFFSET, CONFIG_GPIO_PIN10_OFFSET, CONFIG_GPIO_PIN11_OFFSET, CONFIG_GPIO_PIN12_OFFSET, CONFIG_GPIO_PIN13_OFFSET, CONFIG_GPIO_PIN14_OFFSET, CONFIG_GPIO_PIN15_OFFSET }

MAKE_MISC_DEVICE=ec
MAKE_MISC_CHIPSET=ite
CONFIG_MISC_IOCTL_BASE='A'

# Masked writes preserve wakeup, slew and resistor bits in the same bytes.
CONFIG_MISC_0_ENABLE=1
CONFIG_MISC_0_REG=0x20
CONFIG_MISC_0_MASK=0x03
CONFIG_MISC_0_MAX=2
CONFIG_MISC_0_IOR=_IOR(CONFIG_MISC_IOCTL_BASE, CONFIG_MISC_0_REG, u32)
CONFIG_MISC_0_IOW=_IOW(CONFIG_MISC_IOCTL_BASE, CONFIG_MISC_0_REG, u32)
CONFIG_MISC_0_LABEL="UART1_Mode"

CONFIG_MISC_1_ENABLE=1
CONFIG_MISC_1_REG=0x21
CONFIG_MISC_1_MASK=0x03
CONFIG_MISC_1_MAX=2
CONFIG_MISC_1_IOR=_IOR(CONFIG_MISC_IOCTL_BASE, CONFIG_MISC_1_REG, u32)
CONFIG_MISC_1_IOW=_IOW(CONFIG_MISC_IOCTL_BASE, CONFIG_MISC_1_REG, u32)
CONFIG_MISC_1_LABEL="UART2_Mode"

CONFIG_MISC_2_ENABLE=1
CONFIG_MISC_2_REG=0x4B
CONFIG_MISC_2_MASK=0xFF
CONFIG_MISC_2_IOR=_IOR(CONFIG_MISC_IOCTL_BASE, CONFIG_MISC_2_REG, u32)
CONFIG_MISC_2_IOW=0
CONFIG_MISC_2_LABEL="EC_Firmware_Version"

CONFIG_MISC_3_ENABLE=1
CONFIG_MISC_3_REG=0x36
CONFIG_MISC_3_MASK=0xFF
CONFIG_MISC_3_IOR=_IOR(CONFIG_MISC_IOCTL_BASE, CONFIG_MISC_3_REG, u32)
CONFIG_MISC_3_IOW=0
CONFIG_MISC_3_LABEL="BOARD_ID"
CONFIG_MISC_4_ENABLE=0
CONFIG_MISC_5_ENABLE=0
CONFIG_MISC_6_ENABLE=0
CONFIG_MISC_7_ENABLE=0
CONFIG_MISC_8_ENABLE=0
CONFIG_MISC_9_ENABLE=0
CONFIG_MISC_NUM=10
CONFIG_MISC_MAP={ CONFIG_MISC_0_ENABLE, CONFIG_MISC_1_ENABLE, CONFIG_MISC_2_ENABLE, CONFIG_MISC_3_ENABLE, CONFIG_MISC_4_ENABLE, CONFIG_MISC_5_ENABLE, CONFIG_MISC_6_ENABLE, CONFIG_MISC_7_ENABLE, CONFIG_MISC_8_ENABLE, CONFIG_MISC_9_ENABLE }

# Other firmware controls share bytes or need stateful command handling. They
# are recorded in the board register guide and can gain dedicated interfaces.
